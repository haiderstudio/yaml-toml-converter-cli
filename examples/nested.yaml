server:
  host: localhost
  port: 8080
  tls:
    enabled: true
    cert: /etc/ssl/cert.pem
thresholds:
  warn: 0.75
  fail: 0.95
features:
  - name: search
    enabled: true
    limits:
      perMinute: 60
      burst: 10
  - name: cache
    enabled: false
    limits:
      perMinute: 0
      burst: 0
